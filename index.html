/* v3 cinematic blocking: camera language, character acting, distinct locations */
.cine-stage{transition:background .55s ease}
.cine[data-location="hall"] .cine-stage{background:linear-gradient(120deg,#6689a0,#20435e 48%,#15304b)}
.cine[data-location="lunch"] .cine-stage{background:linear-gradient(125deg,#e4a75f,#8c674c 56%,#42455c)}
.cine[data-location="digital"] .cine-stage{background:linear-gradient(110deg,#29346c,#1f6086 60%,#171e4b)}
.cine[data-location="play"] .cine-stage{background:linear-gradient(120deg,#70b7aa,#409a95 46%,#23566e)}
.cine[data-location="classroom"] .cine-stage{background:linear-gradient(120deg,#d9b780,#6a9fa1 53%,#31546b)}
.cine[data-location="lunch"] .cine-school{background:repeating-linear-gradient(90deg,#ead1a6 0 75px,#d7b98c 75px 82px);border-color:#fff1c1}
.cine[data-location="digital"] .cine-school{background:linear-gradient(130deg,#1c345c,#2b769a);border-color:#55a9d8}
.cine[data-location="digital"] .cine-school:before{border-color:#74efff;box-shadow:inset 0 0 0 14px #1b2947}
.cine[data-location="play"] .cine-school{background:linear-gradient(170deg,#9fdaf5 0 48%,#81b779 49%);border-color:#d9f5dc}
.cine[data-location="classroom"] .cine-school{background:linear-gradient(150deg,#f8e8bf,#b7d4c9);border-color:#d4ecda}
.cine-props{transition:transform .55s,opacity .55s;z-index:1}
.cine-cast{width:75%;justify-content:space-around;gap:0;transition:transform .65s cubic-bezier(.2,.8,.2,1);z-index:3}
.cine-person{min-width:90px;transform-origin:50% 100%;transition:filter .35s,opacity .35s,scale .35s;--sway:0deg}
.cine-person .cine-face{transition:background .35s;animation:cineBreathe 3s ease-in-out infinite}
.cine-person .cine-face:after{content:'•  •';white-space:pre}
.cine-person .cine-face .mouth{position:absolute;top:68%;left:41%;width:19%;height:9%;border-bottom:4px solid #784437;border-radius:50%;z-index:5;transition:all .25s}
.cine-person[data-emotion="sad"] .mouth{border-bottom:0;border-top:4px solid #784437;border-radius:50% 50% 0 0;top:72%}
.cine-person[data-emotion="worried"] .mouth{width:11%;left:45%;height:13%;border:3px solid #784437;border-radius:50%}
.cine-person[data-emotion="happy"] .mouth{height:14%;border-bottom-width:5px}
.cine-person .arm{position:absolute;top:56%;left:-17%;width:27%;height:34%;background:#f4bc8b;border:4px solid #e3a47b;border-radius:24px;z-index:1;transform-origin:80% 10%;transition:transform .4s}
.cine-person .arm.right{left:auto;right:-17%;transform-origin:20% 10%}
.cine-person[data-action="wave"] .arm.right{animation:cineWave .55s ease-in-out infinite alternate}
.cine-person[data-action="explain"] .arm.right{transform:rotate(-65deg);animation:cineExplain 1.1s ease-in-out infinite alternate}
.cine-person[data-action="comfort"] .arm.right{transform:rotate(-68deg)}
.cine-person[data-action="walk"]{animation:cineWalk .44s ease-in-out infinite alternate}
.cine-person[data-action="listen"]{transform:rotate(3deg)}
.cine-person[data-action="shy"]{transform:rotate(-4deg)}
.cine-person.focus{filter:drop-shadow(0 0 18px #ffe6a2);scale:1.09}
.cine-person.dim{opacity:.65;filter:blur(.7px)}
.cine[data-shot="wide"] .cine-scene{animation:cineWide 1.2s ease-out both}
.cine[data-shot="close"] .cine-scene{animation:cineClose 1.1s ease-out both}
.cine[data-shot="left"] .cine-scene{animation:cinePanLeft 1.1s ease-out both}
.cine[data-shot="right"] .cine-scene{animation:cinePanRight 1.1s ease-out both}
.cine[data-shot="wide"] .cine-cast{transform:translateX(-50%) scale(.82)}
.cine[data-shot="close"] .cine-cast{transform:translateX(-50%) scale(1.18) translateY(9%)}
.cine[data-shot="left"] .cine-cast{transform:translateX(-63%) scale(1.03)}
.cine[data-shot="right"] .cine-cast{transform:translateX(-37%) scale(1.03)}
.cine-caption{position:absolute;left:6%;bottom:28%;z-index:9;font-size:12px;letter-spacing:.12em;font-weight:850;color:#f9e9b4;text-shadow:0 2px 8px #001;pointer-events:none}
.cine-stage[data-emphasis="danger"]{box-shadow:inset 0 0 90px #c647435b}
.cine-stage[data-emphasis="hope"]{box-shadow:inset 0 0 100px #7ffbd550}
@keyframes cineWave{from{transform:rotate(-115deg)}to{transform:rotate(-55deg)}}
@keyframes cineExplain{from{transform:rotate(-75deg)}to{transform:rotate(-48deg)}}
@keyframes cineWalk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
@keyframes cineBreathe{50%{transform:translateY(-3px)}}
@keyframes cineWide{from{transform:scale(1.22)}to{transform:scale(1)}}
@keyframes cineClose{from{transform:scale(1.02)}to{transform:scale(1.22)}}
@keyframes cinePanLeft{from{transform:scale(1.14) translateX(4%)}to{transform:scale(1.14) translateX(-3%)}}
@keyframes cinePanRight{from{transform:scale(1.14) translateX(-4%)}to{transform:scale(1.14) translateX(3%)}}
@media(max-width:600px){.cine-cast{width:95%;bottom:15%}.cine-person{min-width:65px}.cine-person.other{display:flex;scale:.8}.cine-face{border-width:3px}.cine-caption{bottom:38%;font-size:10px}.cine[data-shot="close"] .cine-cast{transform:translateX(-50%) scale(1.04)}.cine-dialogue{margin:-7vh auto 2vh}}
@media(prefers-reduced-motion:reduce){.cine-person,.cine-person .cine-face,.cine-person .arm,.cine-scene{animation:none!important;transition:none!important}}

.cine-stage{background:#28445f!important;overflow:hidden}
.cine-school{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;background-size:cover!important;background-position:center!important;border:0!important;border-radius:0!important;transform:none!important;opacity:.96}
.cine-school::before,.cine-school::after{display:none!important}

.cine[data-location="digital"] .cine-school{background-image:url("assets/digital.svg")!important}

.cine[data-location="classroom"] .cine-school{background-image:url("assets/classroom.svg")!important}

.cine-scene{transform-origin:50% 58%;will-change:transform}

.cine-person{--skin:#ffcea0;--hair:#35475a;--top:#69c7d7;position:relative}

.cine-person.focus{opacity:1!important;filter:drop-shadow(0 0 14px #ffedaa)}
.cine-person.dim{opacity:.77!important;filter:brightness(.8)}
.cine-dialogue{position:relative;z-index:20}
.cine-scene{transition:transform .75s cubic-bezier(.22,1,.36,1),filter .6s!important;animation:none!important}
.cine[data-shot="wide"] .cine-scene{transform:scale(1)!important}
.cine[data-shot="close"] .cine-scene{transform:scale(1.22) translateY(4%)!important}

 {id:'hall',label:'복도',emoji:'💬',title:'복도에서 들려온 말',topic:'언어폭력·방어자 행동',x:275,y:210,color:'#fecb74',intro:'쉬는 시간, 친구들이 민준이의 발표 실수를 계속 놀리고 있어요. 민준이는 아무 말 없이 고개를 숙였어요.',question:'이 상황을 본 나는 어떻게 할까요?',choices:[{t:'나도 같이 웃으며 지나간다.',safe:false,result:'웃음이 커지자 민준이는 더 위축되었어요.',why:'함께 웃는 행동도 상대를 상처 입힐 수 있어요. 놀림에 동참하지 않는 것부터 시작해 보세요.'},{t:'안전하다면 “그만하자”라고 말하고, 민준이에게 괜찮은지 묻는다.',safe:true,result:'놀림이 멈추고 민준이가 조용히 고개를 끄덕였어요.',why:'상처 주는 행동을 멈춰 달라고 말하고, 피해를 겪은 친구의 의사를 존중하며 곁에 있어 주었어요.'},{t:'무섭지만 선생님에게 상황을 알려 도움을 요청한다.',safe:true,result:'선생님이 상황을 살피고 민준이의 안전을 확인해 주었어요.',why:'직접 개입이 위험하거나 부담스럽다면 믿을 수 있는 어른에게 알리는 것이 좋은 대처예요.'}],reflect:'친구가 싫어하는 별명이나 놀림을 들으면 내가 할 수 있는 안전한 행동은 무엇일까요?'},

 {id:'classroom',label:'우리 교실',emoji:'🤝',title:'우리 반의 용기 있는 약속',topic:'책임규약·실천',x:477,y:295,color:'#80dff1',intro:'친구들을 도우며 학교에 조금씩 색깔이 돌아왔어요. 이제 우리 반에서 모두를 존중하기 위한 약속을 세울 차례예요.',question:'우리 반 모두가 안전하게 지낼 수 있는 약속은?',choices:[{t:'친구가 싫다는 말이나 행동을 멈추고, 도움이 필요할 때 믿을 수 있는 어른에게 알린다.',safe:true,result:'우리 반 친구들이 서로의 감정과 안전을 존중하기로 약속했어요.',why:'존중·경계·도움 요청을 모두 담은 실천 가능한 약속이에요.'},{t:'친구끼리 생긴 일은 어떤 경우에도 어른에게 말하지 않는다.',safe:false,result:'도움을 요청하지 못한 친구들이 걱정스러운 표정을 지었어요.',why:'비밀을 지키는 것보다 안전이 중요할 때가 있어요. 도움이 필요하면 믿을 수 있는 어른에게 이야기해요.'},{t:'우리 반 친구는 언제나 서로 무조건 같은 의견을 낸다.',safe:false,result:'서로 다른 생각을 가진 친구들이 말하기 어려워했어요.',why:'생각이 달라도 서로 존중하는 것이 중요해요. 동의하지 않아도 안전하게 의견을 표현할 수 있어야 해요.'}],reflect:'내일부터 실천할 수 있는 가장 작은 용기 한 가지는 무엇일까요?'}

const $=s=>document.querySelector(s), canvas=$('#world'),ctx=canvas.getContext('2d'); let state={done:[],name:'',promise:'',energy:0}, modalOpen=false, keys=new Set(),player={x:468,y:515}, target=null,soundOn=false,ac=null, nearId=null, last=0,modalType='';
try{const p=JSON.parse(localStorage.getItem('schoolHeroesV1')||'{}');state={...state,...p};if(!Array.isArray(state.done))state.done=[];}catch{}
function save(){state.energy=state.done.length*20;try{localStorage.setItem('schoolHeroesV1',JSON.stringify(state))}catch{}updateUI()}
function beep(freq=550,dur=.09){if(!soundOn)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch{}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),2600)}
function updateUI(){let d=state.done.length;$('#energy').style.width=(d*20)+'%';$('#steps').textContent=`미션 ${d} / 5`;$('#rank').textContent=d===5?'어울림 마스터':d>=3?'용기 히어로':d>=1?'마음 히어로':'새싹 히어로';$('#recap').textContent=d===5?'5개 미션 완료! 이제 실천 약속과 수료증을 완성하세요.':`${d}개 미션 완료. ${5-d}개 미션이 남았어요. 친구의 안전을 지키는 방법을 배워요.`;$('#certificate').disabled=d!==5;$('#missionlist').innerHTML=scenes.map((s,i)=>`<button class="mission ${state.done.includes(s.id)?'done':''} ${nearId===s.id?'active':''}" data-scene="${s.id}"><span style="font-size:24px">${state.done.includes(s.id)?'✅':s.emoji}</span><span><strong>${i+1}. ${s.title}</strong><small>${s.label} · ${s.topic}</small></span></button>`).join('');document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{let s=scenes.find(x=>x.id===b.dataset.scene);target={x:s.x,y:s.y};toast(`${s.label}으로 이동합니다!`)}))}
function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function line(x,y,x2,y2,c='#ffffff',w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function text(t,x,y,size=16,color='#24475b',bold=true){ctx.fillStyle=color;ctx.font=`${bold?'800':'500'} ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function tile(x,y,w,h,c){roundedRect(x,y,w,h,12,c,'#ffffff7a');for(let i=1;i<4;i++)line(x+w*i/4,y+4,x+w*i/4,y+h-4,'#ffffff21',1)}

   const role=el.dataset.role;el.classList.toggle('focus',role===(frame.focus||'hero'));

 // Smooth camera transitions are driven by shot-specific transforms.

}

 cinematic(s,frames,()=>originalOpenScene(id));
};
const originalShowResult=showResult;
showResult=function(s,i){const c=s.choices[i];if(!c)return;
 const frames=[{who:'나의 선택',line:c.t,shot:'right',focus:'hero',acts:{hero:c.safe?'wave':'explain'},feels:{hero:'neutral',friend:'worried'}},{who:'잠시 후…',line:c.result,shot:'close',focus:'friend',mood:c.safe?'hope':'danger',feels:{friend:c.safe?'happy':'sad'},acts:{hero:c.safe?'comfort':'listen',friend:c.safe?'wave':'shy'}},{who:c.safe?'마음 코치 · 좋은 선택':'마음 코치 · 다시 생각하기',line:c.why,shot:'wide',focus:'hero',mood:c.safe?'hope':'normal',feels:{friend:c.safe?'happy':'worried'},acts:{hero:'explain',friend:'listen'}}];
 cinematic(s,frames,()=>originalShowResult(s,i),c.safe?'good':'bad');
};
const originalCompleteScene=completeScene;
completeScene=function(s){const already=state.done.includes(s.id);
 originalCompleteScene(s);
 if(!already){const m=$('#modal');m.classList.add('cine-clear');setTimeout(()=>m.classList.remove('cine-clear'),900)}
};

</script></body></html>
